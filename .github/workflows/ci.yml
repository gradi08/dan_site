name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql, gd, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: find src config views bin public tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests
        run: vendor/bin/phpunit

      - name: Smoke test (SQLite + serveur intégré)
        run: |
          cp .env.example .env
          php bin/setup.php --seed
          php -S 127.0.0.1:8000 -t public public/index.php > /dev/null 2>&1 &
          sleep 1
          for path in / /objets /objets/1 /connexion /inscription; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/introuvable)" = "404"
